apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: 646278322695.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-auth:latest

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: MONGO_URI
              value: "mongodb+srv://streamadmin:StreamApp123@cluster0.obevtvf.mongodb.net/streamingapp?retryWrites=true&w=majority&appName=Cluster0"

            - name: JWT_SECRET
              value: "supersecret"

            - name: CLIENT_URLS
              value: "*"
